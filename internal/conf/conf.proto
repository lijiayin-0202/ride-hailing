syntax = "proto3";

package ridehailing.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lijayin-0202/radish-ride-service/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message Security {
    string contact_phone_key = 1;
    // 内部服务令牌：调度/车端推进订单状态时通过 X-Internal-Token 传递。
    string internal_token = 2;
  }
  Database database = 1;
  Redis redis = 2;
  Security security = 3;
}
