syntax = "proto3";

package ridehailing.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lijayin-0202/radish-ride-service/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  message DispatchOutbox {
    string vehicle_gateway_addr = 1;
    google.protobuf.Duration request_timeout = 2;
    google.protobuf.Duration poll_interval = 3;
    google.protobuf.Duration lease_duration = 4;
    string order_gateway_addr = 5;
    string dispatch_strategy = 6;
    double dispatch_average_speed_kmh = 7;
    google.protobuf.Duration reassignment_poll_interval = 8;
    google.protobuf.Duration order_sync_poll_interval = 9;
  }
  Database database = 1;
  Redis redis = 2;
  DispatchOutbox dispatch_outbox = 3;
}
