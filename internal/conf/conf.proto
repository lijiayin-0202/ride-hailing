syntax = "proto3";

package ridehailing.conf;

import "google/protobuf/duration.proto";

option go_package = "github.com/lijayin-0202/radish-ride-service/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  // Redis 连接配置；字段口径与后台服务 radish-admin-server 的 config.Redis 对齐
  // （单机/集群二选一、口令、逻辑库），便于两个服务用同一套运维参数。
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    // password 连接口令；敏感项由环境变量注入，yaml 只保留 ${VAR} 占位。
    string password = 5;
    // db 逻辑库编号，仅单机模式生效。
    int32 db = 6;
    // use_cluster 是否启用集群模式。
    bool use_cluster = 7;
    // cluster_addrs 集群节点地址，use_cluster 为 true 时生效。
    repeated string cluster_addrs = 8;
  }
  Database database = 1;
  Redis redis = 2;
}
