syntax = "proto3";

package ridehailing.v1;

option go_package = "github.com/lijayin-0202/radish-ride-service/api/ridehailing/v1;v1";

import "google/api/annotations.proto";

service StationService {
  // 所有站点维护接口属于后台运营端；乘客端选点只读取已发布且可用的站点。
  rpc CreateStation(CreateStationRequest) returns (StationReply) {
    option (google.api.http) = { post: "/v1/admin/stations" body: "*" };
  }
  rpc UpdateStation(UpdateStationRequest) returns (StationReply) {
    option (google.api.http) = { patch: "/v1/admin/stations/{id}" body: "*" };
  }
  rpc ChangeStationStatus(ChangeStationStatusRequest) returns (StationReply) {
    option (google.api.http) = { patch: "/v1/admin/stations/{id}/status" body: "*" };
  }
  rpc ListStations(ListStationsRequest) returns (ListStationsReply) {
    option (google.api.http) = { get: "/v1/admin/stations" };
  }
}

message Station {
  int64 id = 1;
  int64 service_area_id = 2;
  string station_code = 3;
  string station_name = 4;
  string alias_name = 5;
  string address = 6;
  double longitude = 7;
  double latitude = 8;
  int32 station_type = 9;
  int32 service_direction = 10;
  string direction_hint = 11;
  int32 status = 12;
}

message CreateStationRequest {
  int64 service_area_id = 1;
  string station_code = 2;
  string station_name = 3;
  string alias_name = 4;
  string address = 5;
  double longitude = 6;
  double latitude = 7;
  int32 station_type = 8;
  int32 service_direction = 9;
  string direction_hint = 10;
}

message UpdateStationRequest {
  int64 id = 1;
  // service_area_id 与 station_code 未出现在更新请求中，防止改变跨模块定位主键。
  string station_name = 2;
  string alias_name = 3;
  string address = 4;
  double longitude = 5;
  double latitude = 6;
  int32 station_type = 7;
  int32 service_direction = 8;
  string direction_hint = 9;
}

message ChangeStationStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

message ListStationsRequest {
  int64 service_area_id = 1;
}

message StationReply {
  Station station = 1;
}

message ListStationsReply {
  repeated Station stations = 1;
}
