server:
  http:
    network: tcp
    addr: 0.0.0.0:8000
    timeout: 5s
  grpc:
    network: tcp
    addr: 0.0.0.0:9000
    timeout: 5s
data:
  # 派单雪花 ID 节点由环境变量 DISPATCH_SNOWFLAKE_NODE_ID 注入，不能提供默认值。
  database:
    # 主库固定 PostgreSQL；敏感项只允许通过环境变量注入。
    driver: postgres
    source: ${RIDE_DATABASE_SOURCE}
  redis:
    network: tcp
    addr: 127.0.0.1:6379
    read_timeout: 0.5s
    write_timeout: 0.5s
    password: ""
    db: 0
    use_cluster: false
    cluster_addrs: []
  dispatch_outbox:
    # 留空即禁用对应跨模块网关，避免默认连接未知地址。
    vehicle_gateway_addr: ""
    order_gateway_addr: ""
    dispatch_strategy: first-eligible-v1
    dispatch_average_speed_kmh: 30
    request_timeout: 2s
    poll_interval: 1s
    lease_duration: 10s
    reassignment_poll_interval: 1s
    order_sync_poll_interval: 1s
